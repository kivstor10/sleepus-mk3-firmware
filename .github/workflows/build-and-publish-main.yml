name: Build and publish main firmware

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-and-publish-main.yml'
      - 'libraries/**'
      - 'middlewares/**'
      - 'project/**'
      - 'scripts/**'
      - 'tools/build-lua-firmware.ps1'
      - 'tools/package-lua.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-main-firmware
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out firmware source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO ARM toolchain
        shell: pwsh
        run: |
          python -m pip install --upgrade platformio
          pio pkg install --global --tool "platformio/toolchain-gccarmnoneeabi-teensy"

      - name: Build firmware
        shell: pwsh
        run: |
          .\tools\build-lua-firmware.ps1 -Variant Both -Output 'build\Sleepus-MK3-Both.hex' -ArchiveOutput 'build\Sleepus-MK3-Both.sleepus-pack'
          .\tools\build-lua-firmware.ps1 -Variant R6 -Output 'build\Sleepus-MK3-R6.hex' -ArchiveOutput 'build\Sleepus-MK3-R6.sleepus-pack'
          .\tools\build-lua-firmware.ps1 -Variant BF6 -Output 'build\Sleepus-MK3-BF6.hex' -ArchiveOutput 'build\Sleepus-MK3-BF6.sleepus-pack'
          .\tools\build-lua-firmware.ps1 -Variant Bare -Output 'build\Sleepus-MK3-Bare.hex' -ArchiveOutput 'build\Sleepus-MK3-Bare.sleepus-pack'

      - name: Build updater manifest
        shell: pwsh
        run: |
          $artifactDirectory = 'artifact'
          New-Item -ItemType Directory -Force $artifactDirectory | Out-Null
          $variants = [ordered]@{
            both = @{ file = 'Sleepus-MK3-Both.bin'; label = 'Combined R6 and BF6'; source = 'build\Sleepus-MK3-Both.bin' }
            r6 = @{ file = 'Sleepus-MK3-R6.bin'; label = 'R6 only'; source = 'build\Sleepus-MK3-R6.bin' }
            bf6 = @{ file = 'Sleepus-MK3-BF6.bin'; label = 'BF6 only'; source = 'build\Sleepus-MK3-BF6.bin' }
            bare = @{ file = 'Sleepus-MK3-Bare.bin'; label = 'Base firmware'; source = 'build\Sleepus-MK3-Bare.bin' }
          }
          foreach($variant in $variants.Values)
          {
            Copy-Item $variant.source "$artifactDirectory\$($variant.file)" -Force
            $variant.Remove('source')
            $variant.size = (Get-Item "$artifactDirectory\$($variant.file)").Length
            $variant.sha256 = (Get-FileHash "$artifactDirectory\$($variant.file)" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          New-Item -ItemType Directory -Force "$artifactDirectory\packs" | Out-Null
          Copy-Item 'build\Sleepus-MK3-*.sleepus-pack' "$artifactDirectory\packs" -Force
          Copy-Item "$artifactDirectory\Sleepus-MK3-Bare.bin" "$artifactDirectory\Sleepus-MK3.bin" -Force
          $latestTag = git tag --list 'v[0-9]*' --sort=-v:refname |
            Select-Object -First 1
          if($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$')
          {
            throw "Expected a semantic version tag, found '$latestTag'."
          }
          $version = "v$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)"
          $manifest = [ordered]@{
            version = $version
            file = 'Sleepus-MK3-Bare.bin'
            size = $variants.bare.size
            sha256 = $variants.bare.sha256
            defaultVariant = 'bare'
            variants = $variants
            publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "$artifactDirectory\manifest.json" -Value $manifest -NoNewline
          "FIRMWARE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check out public updater
        uses: actions/checkout@v4
        with:
          repository: kivstor10/sleepus-mk3
          ssh-key: ${{ secrets.UPDATER_DEPLOY_KEY }}
          path: updater

      - name: Publish firmware to updater
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'updater\firmware' | Out-Null
          New-Item -ItemType Directory -Force 'updater\firmware\packs' | Out-Null
          Copy-Item 'artifact\Sleepus-MK3*.bin','artifact\manifest.json' 'updater\firmware' -Force
          Copy-Item 'artifact\packs\*.sleepus-pack' 'updater\firmware\packs' -Force
          Set-Location updater
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0)
          {
            exit 0
          }
          git commit -m "Publish firmware $env:FIRMWARE_VERSION"
          git push

      - name: Tag published firmware version
        shell: pwsh
        run: |
          git tag -a $env:FIRMWARE_VERSION -m "Publish Sleepus MK3 $env:FIRMWARE_VERSION firmware"
          git push origin $env:FIRMWARE_VERSION